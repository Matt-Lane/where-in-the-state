    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>

    <script>
        // Tiny helpers for the map components: measure an element's actual
        // rendered size/position in CSS pixels, so map clicks and drags can
        // be converted to viewBox coordinates at whatever size the page CSS
        // chose. svgSize returns [width, height]; svgRect returns
        // [left, top, width, height] (viewport-relative, for ClientX/Y).
        window.whereInTheState = {
            svgSize: function (el) {
                var r = el.getBoundingClientRect();
                return [r.width, r.height];
            },
            svgRect: function (el) {
                var r = el.getBoundingClientRect();
                return [r.left, r.top, r.width, r.height];
            },
            // Keep pointer events flowing to the map during a gesture
            // (pinch/pan/drag) even if the finger slides off the map.
            // Best-effort: not all browsers/elements support capture.
            capturePointer: function (el, pointerId) {
                try { el.setPointerCapture(pointerId); } catch (e) {}
            },
            // Schedule one animation frame of viewport smoothing: the map
            // components ease the displayed viewBox toward the pinch/pan
            // target on the display refresh (see MapViewport), instead of
            // re-rendering on every pointermove. The .NET side calls
            // ViewportFrame on the given reference once per frame and
            // re-schedules while the view is still moving. Fully guarded:
            // a disposed reference just stops the loop.
            requestViewportFrame: function (dotNetRef) {
                requestAnimationFrame(function () {
                    try {
                        var p = dotNetRef.invokeMethodAsync("ViewportFrame");
                        if (p && p.catch) { p.catch(function () {}); }
                    } catch (e) {}
                });
            },
            // Analytics (PostHog) — see GAME-SPEC §13. captureEvent is the
            // only way the game talks to PostHog. It is fully guarded: if
            // an ad blocker stops the library loading, or the network is
            // down, the call is a no-op and the game plays exactly the
            // same. It never throws.
            captureEvent: function (name, props) {
                try {
                    if (window.posthog && typeof window.posthog.capture === "function") {
                        window.posthog.capture(name, props || {});
                    }
                } catch (e) { /* Analytics must never break the game. */ }
            },
            // The in-progress game's context, for the game_abandoned event:
            // the game page sets it when a game starts (and updates it
            // after each scored round) and clears it when the results
            // screen is reached. If the player leaves the page (tab close,
            // refresh, navigating to another site) while it is set, the
            // pagehide handler below reports the game as abandoned.
            // In-app navigation inside the Blazor SPA does not unload the
            // page, so it is not captured — best effort only.
            _gameContext: null,
            setGameContext: function (ctx) {
                try { window.whereInTheState._gameContext = ctx || null; } catch (e) {}
            },
            clearGameContext: function () {
                try { window.whereInTheState._gameContext = null; } catch (e) {}
            }
        };
        // Best-effort game_abandoned: only when a game is in progress.
        window.addEventListener("pagehide", function () {
            try {
                var ctx = window.whereInTheState._gameContext;
                if (ctx) {
                    window.whereInTheState.captureEvent("game_abandoned", ctx);
                }
            } catch (e) { /* Analytics must never break the game. */ }
        });
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
