<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Where in the State — a geography game. Ten Oregon cities, one blank map. Drop a pin where you think each city is and see how close you were." />
    <meta name="theme-color" content="#205c46" />
    <title>Where in the State — Oregon</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        // Tiny helper for the map component: measure an element's actual
        // rendered size in CSS pixels, so map clicks can be converted to
        // viewBox coordinates at whatever size the page CSS chose.
        window.whereInTheState = {
            svgSize: function (el) {
                var r = el.getBoundingClientRect();
                return [r.width, r.height];
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
